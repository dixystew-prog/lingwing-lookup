let activeType = 'all';
let query = '';

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function highlight(text, q) {
  if (!q) return text;
  try { return text.replace(new RegExp('(' + escapeRe(q) + ')', 'gi'), '<mark>$1</mark>'); }
  catch(e) { return text; }
}

function render() {
  const q = query.toLowerCase().trim();
  const filtered = DATA.filter(d => {
    if (activeType !== 'all' && d.type !== activeType) return false;
    if (!q) return true;
    return d.georgian.toLowerCase().includes(q) || d.english.toLowerCase().includes(q);
  });

  document.getElementById('stats').textContent = filtered.length + ' result' + (filtered.length !== 1 ? 's' : '') + (q ? ' for "' + query + '"' : '') + ' · 893 total entries';

  const el = document.getElementById('results');
  if (!filtered.length) {
    el.innerHTML = '<div class="no-results"><div style="font-size:2rem;margin-bottom:0.5rem">ვერ ვპოვე</div>No results found</div>';
    return;
  }

  const limit = Math.min(filtered.length, 80);
  el.innerHTML = filtered.slice(0, limit).map(d => {
    const geo = highlight(d.georgian, query);
    const eng = highlight(d.english, query);
    const badge = `<span class="type-badge type-${d.type}">${d.type}</span>`;
    let answerContent = '';
    if (d.type === 'mistakecorrection') {
      answerContent = `<div class="answer-label">Correct answer</div><div class="answer-text">${geo}</div>`;
      if (d.hint) answerContent += `<div class="hint-text">${d.hint}</div>`;
    } else {
      answerContent = `<div class="answer-label">Translation</div><div class="answer-text">${eng}</div>`;
    }
    const copyText = d.type === 'mistakecorrection' ? d.georgian : d.english;
    return `<div class="result-card" onclick="toggle(this)">
      <div class="card-top">
        <span class="card-num">#${d.num}</span>
        <span class="card-georgian">${d.type === 'mistakecorrection' ? eng : geo}</span>
        ${badge}
      </div>
      <div class="card-answer">
        ${answerContent}
        <button class="copy-btn" onclick="copyAns(event,this,\`${copyText.replace(/`/g,'\\`')}\`)">Copy answer</button>
      </div>
    </div>`;
  }).join('');

  if (filtered.length > limit) {
    el.innerHTML += `<div style="text-align:center;padding:1rem;color:#555;font-size:0.85rem">Showing first ${limit} of ${filtered.length} — refine search to see more</div>`;
  }

  // Auto-expand first result if auto-searched
  if (document.getElementById('autoBadge').style.display !== 'none') {
    const first = el.querySelector('.result-card');
    if (first) first.classList.add('expanded');
  }
}

function toggle(card) { card.classList.toggle('expanded'); }

function copyAns(e, btn, text) {
  e.stopPropagation();
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy answer'; btn.classList.remove('copied'); }, 2000);
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  query = e.target.value;
  document.getElementById('autoBadge').style.display = 'none';
  render();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeType = btn.dataset.type;
    render();
  });
});

// Read ?q= from URL on load
const params = new URLSearchParams(window.location.search);
const urlQuery = params.get('q');
if (urlQuery) {
  query = urlQuery;
  document.getElementById('searchInput').value = urlQuery;
  document.getElementById('autoBadge').style.display = 'inline';
}

render();
</script>
