let activeType='all', query='';
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hi(text,q){if(!q)return text;try{return text.replace(new RegExp('('+esc(q)+')','gi'),'<mark>$1</mark>');}catch(e){return text;}}
function render(){
  const q=query.toLowerCase().trim();
  const filtered=DATA.filter(d=>{
    if(activeType!=='all'&&d.type!==activeType)return false;
    if(!q)return true;
    return d.georgian.toLowerCase().includes(q)||d.english.toLowerCase().includes(q)||(d.roman&&d.roman.toLowerCase().includes(q));
  });
  document.getElementById('stats').textContent=filtered.length+' result'+(filtered.length!==1?'s':'')+(q?' for "'+query+'"':'')+' · 1394 total';
  const el=document.getElementById('results');
  if(!filtered.length){el.innerHTML='<div class="no-results"><div style="font-size:2rem;margin-bottom:0.5rem">ვერ ვპოვე</div>No results found</div>';return;}
  const limit=Math.min(filtered.length,80);
  const autoOn=document.getElementById('autoBadge').style.display!=='none';
  el.innerHTML=filtered.slice(0,limit).map((d,i)=>{
    const geo=hi(d.georgian,query),eng=hi(d.english,query);
    const badge=`<span class="type-badge type-${d.type}">${d.type}</span>`;
    let ans='';
    if(d.type==='mistakecorrection'){
      ans=`<div class="answer-label">Correct answer</div><div class="answer-text">${geo}</div>`;
      if(d.hint)ans+=`<div class="hint-text">${d.hint}</div>`;
    } else {
      ans=`<div class="answer-label">Translation / Answer</div><div class="answer-text">${eng}</div>`;
      if(d.hint)ans+=`<div class="hint-text">${d.hint}</div>`;
    }
    const copyText=d.type==='mistakecorrection'?d.georgian:d.english;
    const expanded=autoOn&&i===0?' expanded':'';
    return `<div class="result-card${expanded}" onclick="toggle(this)">
      <div class="card-top">
        <span class="card-num">#${d.num}</span>
        <span class="card-georgian">${d.type==='mistakecorrection'?eng:geo}<br><span class="card-roman">${d.roman||''}</span></span>
        ${badge}
      </div>
      <div class="card-answer">${ans}
        <div class="btn-row">
          <button class="copy-btn" onclick="copyAns(event,this,\`${copyText.replace(/`/g,'\\`')}\`)">Copy answer</button>
          <button class="first-btn" onclick="showFL(event,this,\`${copyText.replace(/`/g,'\\`')}\`)">First letters</button>
        </div>
        <div class="first-letters"></div>
      </div>
    </div>`;
  }).join('');
  if(filtered.length>limit)el.innerHTML+=`<div style="text-align:center;padding:1rem;color:#555;font-size:0.85rem">Showing first ${limit} of ${filtered.length} — refine search</div>`;
}
function toggle(c){c.classList.toggle('expanded');}
function copyAns(e,btn,text){e.stopPropagation();navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy answer';btn.classList.remove('copied');},2000);});}
function showFL(e,btn,text){e.stopPropagation();const fl=btn.parentElement.nextElementSibling;if(fl.style.display==='block'){fl.style.display='none';return;}const letters=text.trim().split(/\s+/).map(w=>w[0]).join(' · ');fl.textContent=letters;fl.style.display='block';}
document.getElementById('searchInput').addEventListener('input',e=>{query=e.target.value;document.getElementById('autoBadge').style.display='none';render();});
document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeType=btn.dataset.type;render();});});
const params=new URLSearchParams(window.location.search);
const uq=params.get('q');
if(uq){query=uq;document.getElementById('searchInput').value=uq;document.getElementById('autoBadge').style.display='inline';}
render();
</script>
